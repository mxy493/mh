name: Tencent Cloudbase

# 推送 master 分支时自动部署静态站点到云开发静态托管
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy static to Tencent CloudBase
    env:
      SITE_DIR: ${{ runner.temp }}/site

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # 云开发 CLI 的 framework 部署能力在 3.x 的打包产物里无法加载外部插件，
    # 这里直接用静态托管上传命令部署，行为与原来的 v1 action 一致
    - name: Install CloudBase CLI
      run: npm install -g @cloudbase/cli

    - name: Login to CloudBase
      run: tcb login --apiKeyId "${{ secrets.SECRET_ID }}" --apiKey "${{ secrets.SECRET_KEY }}"

    # CLI 会校验上传目录中每个文件的读写权限，而 .git 下的对象文件是只读的，
    # 所以先把要发布的静态文件复制到单独目录，顺带排除开发用文件
    - name: Stage static files
      run: |
        rsync -a \
          --exclude '.git/' \
          --exclude '.github/' \
          --exclude '.vscode/' \
          --exclude 'cloudbaserc.json' \
          --exclude 'cloudbaserc.js' \
          --exclude 'README.md' \
          ./ "$SITE_DIR/"
        chmod -R u+w "$SITE_DIR"
        du -sh "$SITE_DIR"

    - name: Deploy static files
      run: tcb hosting deploy "$SITE_DIR/" / -e "${{ secrets.ENV_ID }}"
