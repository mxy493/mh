name: Tencent Cloudbase

# 推送 master 分支时自动部署静态站点到云开发静态托管
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy static to Tencent CloudBase

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    # 云开发 CLI 的 framework 部署能力在 3.x 的打包产物里无法加载外部插件，
    # 这里直接用静态托管上传命令部署，行为与原来的 v1 action 一致
    - name: Install CloudBase CLI
      run: npm install -g @cloudbase/cli

    - name: Login to CloudBase
      run: tcb login --apiKeyId "${{ secrets.SECRET_ID }}" --apiKey "${{ secrets.SECRET_KEY }}"

    - name: Deploy static files
      run: >-
        tcb hosting deploy ./ / -e "${{ secrets.ENV_ID }}"
        --ignore ".github,.github/**,.vscode,.vscode/**,cloudbaserc.json,cloudbaserc.js,cloudbase-framework.json,README.md"
