name: Tencent Cloudbase

# 推送 master 分支时自动部署
on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Tencent Cloudbase Github Action
    env:
      # cloudbaserc.json 里用 {{env.ENV_ID}} 引用，本地执行时可自行 export
      ENV_ID: ${{ secrets.ENV_ID }}

    steps:
    - name: Checkout
      uses: actions/checkout@v2

    # 使用云开发 Github Action 部署（v2 会自动读取仓库根目录的 cloudbaserc.json）
    - name: Tencent CloudBase Github Action
      uses: TencentCloudBase/cloudbase-action@v2.0.1
      with:
        # 云开发的访问密钥 secretId 和 secretKey
        secretId: ${{ secrets.SECRET_ID }}
        secretKey: ${{ secrets.SECRET_KEY }}
        # 云开发的环境 id
        envId: ${{ secrets.ENV_ID }}
